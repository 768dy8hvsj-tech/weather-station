<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Consensus</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page page-wide">
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <h1 id="page-title">Iceland Stations</h1>
          <p id="page-subtitle" class="subtitle">Conditions at a glance, from the Icelandic Met Office's own network.</p>
        </div>
        <div class="nav-links">
          <a id="back-link" class="nav-link hidden" href="/">← All stations</a>
          <a class="nav-link" href="/forecast.html">Detailed forecast →</a>
        </div>
      </div>
      <p id="updated-at" class="updated-at"></p>
    </header>

    <div id="golf-filter-wrap" class="golf-filter-wrap hidden">
      <button id="golf-filter-toggle" class="golf-filter-toggle" type="button" aria-pressed="false"></button>
    </div>

    <div class="slider-panel">
      <div class="slider-header">
        <span class="slider-label">Forecast for</span>
        <span id="slider-value" class="slider-value">Now</span>
      </div>
      <input id="hours-slider" class="hours-slider" type="range" min="0" max="72" step="4" value="0" />
      <div class="slider-ticks"><span>Now</span><span>+72h</span></div>
    </div>

    <div id="status" class="status hidden"></div>

    <div id="station-grid"></div>
  </div>

  <script src="/icons.js"></script>
  <script src="/golf-stations.js"></script>
  <script src="/stations.js"></script>
</body>
</html>
