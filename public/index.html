<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Consensus</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <h1>Weather Consensus</h1>
      <p class="subtitle">Blends yr.no, the Icelandic Met Office, and Open-Meteo's ECMWF/GFS/ICON models into one forecast.</p>
    </header>

    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="Search a place in Iceland (e.g. Húsafell, Ásbyrgi, Reykjavík)" autocomplete="off" />
      <div id="suggestions" class="suggestions hidden"></div>
    </div>

    <div id="status" class="status hidden"></div>

    <section id="result" class="result hidden">
      <div class="location-header">
        <div>
          <h2 id="location-name"></h2>
          <p id="location-meta" class="location-meta"></p>
        </div>
        <span id="source-badge" class="badge"></span>
      </div>
      <div id="reliability" class="reliability hidden"></div>
      <div id="days"></div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
